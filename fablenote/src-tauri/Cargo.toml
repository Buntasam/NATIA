[package]
name = "natia"
version = "0.1.0"
description = "NATIA - AI-powered note taking"
authors = ["Buntasam"]
license-file = "../../LICENSE"
edition = "2021"

[lib]
name = "natia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
sha2 = "0.10"
argon2 = "0.5"
aes-gcm = { version = "0.10", features = ["aes"] }
rand = "0.8"
base64 = "0.22"
zip = { version = "=2.6.1", default-features = false, features = ["deflate", "aes-crypto"] }
ammonia = "~4.1.8"
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
zeroize = "1"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-single-instance = "=2.4.1"
tauri-plugin-autostart = "=2.5.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }
