name: Audit des dépendances

# Failles connues dans les dépendances npm et Rust : chaque lundi, et dès qu'un fichier
# de verrouillage change.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: ["fablenote/package-lock.json", "fablenote/src-tauri/Cargo.lock", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # Dépendances livrées dans l'application seulement, failles « high » et « critical ».
      # Restent connues et acceptées : TipTap v2 (moderate, corrigé en v3) et markdown-it (moderate).
      - name: npm audit
        working-directory: fablenote
        run: npm audit --omit=dev --audit-level=high

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-09
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Ignorées, car NATIA n'utilise pas le code concerné :
      # - zip (RUSTSEC-2026-0367/0368/0369/0429) : ne touchent que ZipArchive::extract(),
      #   jamais appelé (les archives sont lues entrée par entrée) ;
      # - quick-xml (RUSTSEC-2026-0194/0195) : dépendance de Tauri, qui ne lit que ses
      #   propres fichiers XML, pas des fichiers fournis par l'utilisateur.
      - name: cargo audit
        working-directory: fablenote/src-tauri
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369 --ignore RUSTSEC-2026-0429
          --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
