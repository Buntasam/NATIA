name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fablenote/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fablenote/src-tauri

      - name: Install frontend dependencies
        working-directory: fablenote
        run: npm ci

      - name: Rust tests
        working-directory: fablenote/src-tauri
        run: cargo test --no-default-features --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: fablenote
          tagName: ${{ github.ref_name }}
          releaseName: "NATIA ${{ github.ref_name }}"
          releaseBody: "Version bêta — voir le disclaimer au premier lancement."
          releaseDraft: true
          prerelease: true
