name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # Actions épinglées par commit (et non par version comme « v5 », qui peut être déplacée) :
    # elles ont accès à la clé de signature des mises à jour. Pour en changer, relever le
    # commit d'une version publiée depuis au moins deux semaines.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fablenote/package-lock.json

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # 2026-10-09
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fablenote/src-tauri

      - name: Install frontend dependencies
        working-directory: fablenote
        run: npm ci

      - name: Rust tests
        working-directory: fablenote/src-tauri
        run: cargo test --no-default-features --lib

      # La version de l'app vient du tag (v6.2.0 -> 6.2.0) : c'est elle que le
      # système de mise à jour compare à la version installée.
      - name: Set app version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Le tag doit être de la forme vX.Y.Z (reçu : $GITHUB_REF_NAME)"; exit 1
          fi
          node -e "const f='fablenote/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: fablenote
          tagName: ${{ github.ref_name }}
          releaseName: "NATIA ${{ github.ref_name }}"
          # Lu par les visiteurs de la page GitHub (la fenêtre de mise à jour de l'app ne l'affiche pas).
          releaseBody: |
            **NATIA ${{ github.ref_name }} — version bêta.**

            Téléchargez `NATIA_${{ steps.version.outputs.value }}_x64-setup.exe` et lancez-le. La mise à jour conserve vos notes et vos paramètres.

            Déjà installée ? NATIA propose elle-même la mise à jour au démarrage.
          # Brouillon à vérifier puis publier à la main. Pas en « pre-release » :
          # le système de mise à jour ne lit que la dernière release publiée.
          releaseDraft: true
          prerelease: false
